<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2 посилання на проєкти</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         background:linear-gradient(135deg,#f0fdfa,#ecfeff); }
  .box { background:#fff; border:1px solid #e7e5e4; border-radius:20px;
         padding:36px 40px; max-width:520px; width:calc(100% - 40px);
         box-shadow:0 10px 40px rgba(0,0,0,.06); }
  h1 { margin:0 0 4px; font-size:26px; }
  p  { margin:0 0 24px; color:#78716c; font-size:15px; }
  a.card { display:flex; align-items:center; gap:14px; text-decoration:none;
           border:1px solid #e7e5e4; border-radius:14px; padding:16px 18px;
           margin-bottom:14px; color:#1c1917; transition:.15s; }
  a.card:hover { border-color:#0d9488; background:#f0fdfa; transform:translateY(-2px); }
  .ico { font-size:26px; }
  .t  { font-weight:700; font-size:17px; }
  .u  { font-size:13px; color:#78716c; word-break:break-all; }
  .go { margin-left:auto; color:#0d9488; font-weight:700; font-size:20px; }
  footer { margin-top:18px; font-size:13px; color:#a8a29e; text-align:center; }
</style>
</head>
<body>
<div class="box">
  <h1>Два проєкти</h1>
  <p>Натисни на потрібне посилання — воно відкриється в новій вкладці.</p>

  <a class="card" href="https://olenaklocko-cyber.github.io/kartky/" target="_blank">
    <span class="ico">🎬</span>
    <span><span class="t">1. Мій каталог фільмів</span><br>
          <span class="u">olenaklocko-cyber.github.io/kartky</span></span>
    <span class="go">→</span>
  </a>

  <a class="card" href="https://travelog-ai.vercel.app" target="_blank">
    <span class="ico">🧳</span>
    <span><span class="t">2. Мій розумний тревелог</span><br>
          <span class="u">travelog-ai.vercel.app</span></span>
    <span class="go">→</span>
  </a>

  <footer>Вхідні дані для перегляду — у файлі INDEX.html</footer>
</div>
</body>
</html>
