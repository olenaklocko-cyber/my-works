<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажер для мозку: Логіка та IQ</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <div class="header-icon">🧠</div>
            <h1>Тренажер для мозку</h1>
            <p class="subtitle">Логіка та IQ</p>
        </header>
        
        <main id="content">
            <!-- Стартовий екран -->
            <div id="start-screen" class="screen active">
                <div class="start-icon">🎯</div>
                <h2>Готовий перевірити свою логіку?</h2>
                <p class="start-desc">Тут на тебе чекають цікаві питання на логіку та уважність</p>
                <div class="stats-preview">
                    <div class="stat-item">
                        <span class="stat-number" id="total-questions">5</span>
                        <span class="stat-label">Питань</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-number">⏱️</span>
                        <span class="stat-label">Без таймера</span>
                    </div>
                </div>
                <button class="btn-primary" id="start-btn">Почати тест</button>
            </div>
            
            <!-- Екран питання -->
            <div id="question-screen" class="screen">
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <div class="question-header">
                    <span class="question-number" id="question-number">Питання 1 з 5</span>
                    <span class="question-category" id="question-category">Логіка</span>
                </div>
                <div class="question-text" id="question-text"></div>
                <div class="answers" id="answers"></div>
                <button class="btn-next" id="next-btn">Наступне питання →</button>
            </div>
            
            <!-- Екран результату -->
            <div id="result-screen" class="screen">
                <div class="result-icon" id="result-icon">🎉</div>
                <h2 id="result-title">Чудово!</h2>
                <div class="result-score" id="result-score">4 з 5</div>
                <p class="result-message" id="result-message">Ви розім'яли мізки на 4 з 5 балів!</p>
                <button class="btn-primary" id="restart-btn">Почати знову</button>
            </div>
        </main>
        
        <!-- Форма додавання питань -->
        <section class="add-question-section">
            <h3>➕ Додати нове питання</h3>
            <form id="add-question-form">
                <div class="form-group">
                    <label>Текст питання *</label>
                    <input type="text" id="new-question" placeholder="Наприклад: Скільки буде 2+2?" required>
                </div>
                
                <div class="form-group">
                    <label>Категорія</label>
                    <select id="new-category">
                        <option value="Логіка">Логіка</option>
                        <option value="Уважність">Уважність</option>
                        <option value="Математика">Математика</option>
                        <option value="Загадка">Загадка</option>
                    </select>
                </div>
                
                <div class="form-group correct-answer-group">
                    <label>✅ Правильна відповідь *</label>
                    <input type="text" id="new-option1" placeholder="Введіть правильну відповідь" required>
                </div>
                
                <div class="form-group">
                    <label>❌ Неправильна відповідь 1 *</label>
                    <input type="text" id="new-option2" placeholder="Введіть неправильну відповідь" required>
                </div>
                
                <div class="form-group">
                    <label>❌ Неправильна відповідь 2 (необов'язково)</label>
                    <input type="text" id="new-option3" placeholder="Можна пропустити">
                </div>
                
                <div class="form-group">
                    <label>❌ Неправильна відповідь 3 (необов'язково)</label>
                    <input type="text" id="new-option4" placeholder="Можна пропустити">
                </div>
                
                <button type="submit" class="btn-add">Додати питання</button>
            </form>
            
            <div class="added-questions" id="added-questions">
                <h4>Додані питання:</h4>
                <div id="custom-questions-list"></div>
            </div>
        </section>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
